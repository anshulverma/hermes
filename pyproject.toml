[project]
name = "hermes"
version = "0.1.0"
description = "A standalone engine for running multi-agent work across a fleet"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
hermes = "engine.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "httpx>=0.27.0",
]
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "server*", "agents*", "sites*", "playbooks*"]
exclude = ["tests*", "testkit*", "web*", "fleet*", "scripts*",
           "integrations*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
]
markers = [
    "docker: marks tests requiring Docker (deselect with '-m \"not docker\"')",
]
filterwarnings = [
    # Upstream: this Starlette version warns FastAPI's TestClient prefers httpx2.
    # Not our code; narrow-ignore by message so our own warnings still surface.
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]
